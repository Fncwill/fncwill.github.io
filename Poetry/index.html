<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Poetry</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            padding: 40px;
            margin: 0;
        }

        h1 {
            margin-bottom: 25px;
        }

        #file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 800px;
        }

        .file {
            display: block;
            padding: 15px 20px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }

        .file:hover {
            background: #333;
            transform: translateX(5px);
        }

        .loading {
            color: #aaa;
        }

        .error {
            color: #ff6666;
        }
    </style>
</head>

<body>

    <h1>My Poetry</h1>

    <div id="file-list">
        <div class="loading">Loading poems...</div>
    </div>

    <script>

        const username = "fncwill";
        const repository = "fncwill.github.io";
        const folder = "Poetry";

        const apiURL =
            `https://api.github.com/repos/${username}/${repository}/contents/${folder}`;

        fetch(apiURL)

            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not access the GitHub folder.");
                }

                return response.json();
            })

            .then(files => {

                const fileList = document.getElementById("file-list");

                fileList.innerHTML = "";

                const htmlFiles = files.filter(file =>
                    file.type === "file" &&
                    file.name.toLowerCase().endsWith(".html") &&
                    file.name.toLowerCase() !== "index.html"
                );

                if (htmlFiles.length === 0) {

                    fileList.innerHTML =
                        "<div>No HTML files found.</div>";

                    return;
                }

                htmlFiles.forEach(file => {

                    const link = document.createElement("a");

                    link.className = "file";

                    link.href = `./${file.name}`;

                    link.textContent = file.name
                        .replace(".html", "")
                        .replace(/[-_]/g, " ")
                        .replace(/\b\w/g, letter => letter.toUpperCase());

                    fileList.appendChild(link);

                });

            })

            .catch(error => {

                document.getElementById("file-list").innerHTML =
                    `<div class="error">${error.message}</div>`;

            });

    </script>

</body>
</html>
