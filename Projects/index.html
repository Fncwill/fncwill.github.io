<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Teko:wght@300;400;500;600;700&family=Audiowide&family=Black+Ops+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: #2a2a2a;
            position: relative;
            overflow-x: hidden;
        }

        /* Perforated metal texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at center, transparent 2px, #2a2a2a 2px),
                linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #3a3a3a 100%);
            background-size: 8px 8px, 100% 100%;
            background-position: 0 0, 0 0;
            z-index: -1;
        }

        /* Additional metallic overlay for depth */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at top, rgba(70, 70, 70, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(0, 0, 0, 0.3) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Logo placeholder */
        .logo-container {
            width: 200px;
            height: 200px;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #353535, #1f1f1f);
            border-radius: 50%;
            box-shadow:
                inset 0 4px 8px rgba(0, 0, 0, 0.6),
                0 8px 16px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(100, 149, 237, 0.2);
            border: 3px solid #404040;
            overflow: hidden;
            position: relative;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 1.5px, rgba(0, 0, 0, 0.1) 1.5px);
            background-size: 6px 6px;
            pointer-events: none;
            opacity: 0.3;
            z-index: 2;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            position: relative;
            z-index: 1;
        }

        .logo-placeholder {
            color: #666;
            font-size: 0.75rem;
            text-align: center;
            padding: 1rem;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            z-index: 1;
        }

        /* Button grid container */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
        }

        /* Navigation buttons */
        .nav-button {
            background: linear-gradient(145deg, #3a3a3a, #252525);
            border: none;
            padding: 3rem 2rem;
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Black Ops One', cursive;
            color: #c0c0c0;
            cursor: pointer;
            border-radius: 12px;
            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px solid #404040;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(100, 149, 237, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Thumbnail content container */
        .button-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Yahtzee button styles */
        .yahtzee-button {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
        }

        .yahtzee-button .dice-container {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .dice {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #000;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .yahtzee-text {
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-shadow:
                3px 3px 0 #000,
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                0 0 20px rgba(255, 255, 0, 0.5);
            font-family: 'Black Ops One', cursive;
        }

        /* NPA/NXX button styles */
        .npa-button {
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
        }

        .canada-flag {
            width: 120px;
            height: 80px;
            margin-bottom: 1rem;
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .flag-red {
            position: absolute;
            background: #FF0000;
            height: 100%;
        }

        .flag-red.left {
            left: 0;
            width: 25%;
        }

        .flag-red.right {
            right: 0;
            width: 25%;
        }

        .flag-white {
            position: absolute;
            left: 25%;
            width: 50%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maple-leaf {
            font-size: 2.5rem;
            color: #FF0000;
        }

        .phone-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .npa-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #000;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            font-family: 'Black Ops One', cursive;
        }

        /* LoL Build Creator button styles */
        .lol-button {
            background: linear-gradient(135deg, #0a1428 0%, #0a323c 100%);
        }

        .lol-icon {
            width: 120px;
            height: 100px;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5))
                    drop-shadow(0 0 10px rgba(10, 200, 185, 0.5));
            transition: transform 0.3s ease;
        }

        .lol-button:hover .lol-icon {
            transform: scale(1.08) rotate(-4deg);
        }

        .lol-text {
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Black Ops One', cursive;
            color: #f0e6d2;
            text-shadow:
                3px 3px 0 #000,
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                0 0 20px rgba(200, 170, 110, 0.6);
        }

        /* Blank button */
        .blank-button {
            background: linear-gradient(145deg, #3a3a3a, #252525);
        }

        /* Perforated texture on buttons */
        .nav-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 1.5px, rgba(0, 0, 0, 0.1) 1.5px);
            background-size: 6px 6px;
            pointer-events: none;
            opacity: 0.5;
        }

        .nav-button:hover {
            transform: translateY(-4px);
            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(100, 149, 237, 0.5),
                0 0 60px rgba(100, 149, 237, 0.3);
            border-color: #6495ED;
            color: #ffffff;
            background: linear-gradient(145deg, #454545, #2f2f2f);
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(100, 149, 237, 0.8),
                0 0 30px rgba(100, 149, 237, 0.5);
        }

        /* Keep each themed button's own background on hover */
        .yahtzee-button:hover {
            background: linear-gradient(135deg, #ff1a1a 0%, #d90000 100%);
        }

        .npa-button:hover {
            background: linear-gradient(135deg, #ffffff 0%, #ececec 100%);
        }

        .lol-button:hover {
            background: linear-gradient(135deg, #0d1c36 0%, #0d4150 100%);
        }

        .nav-button:active {
            transform: translateY(-2px);
            box-shadow:
                0 6px 12px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Responsive design */
        @media (max-width: 900px) {
            .button-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 1rem;
            }

            .nav-button {
                padding: 2.5rem 1.5rem;
            }

            .yahtzee-text {
                font-size: 2rem;
            }

            .npa-text {
                font-size: 1.3rem;
            }

            .lol-text {
                font-size: 1.3rem;
            }

            .lol-icon {
                width: 90px;
                height: 75px;
            }

            .dice {
                width: 35px;
                height: 35px;
                font-size: 1.3rem;
            }

            .canada-flag {
                width: 90px;
                height: 60px;
            }

            .maple-leaf {
                font-size: 2rem;
            }

            .phone-icon {
                font-size: 2.5rem;
            }

            .logo-container {
                width: 150px;
                height: 150px;
                margin-bottom: 2rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .nav-button,
            .lol-icon {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <!-- Logo placeholder -->
    <div class="logo-container">
        <img src="logo.jpg" alt="Logo" class="logo-image">
    </div>

    <!-- Button grid -->
    <div class="button-grid">
        <!-- Yahtzee Button -->
        <button class="nav-button yahtzee-button" onclick="location.href='/Projects/HtmlYahtzee.html'">
            <div class="button-content">
                <div class="dice-container">
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                </div>
                <div class="yahtzee-text">YHATZEE</div>
            </div>
        </button>

        <!-- NPA/NXX Lookup Button -->
        <button class="nav-button npa-button" onclick="location.href='/Projects/canadian_phone.html'">
            <div class="button-content">
                <div class="canada-flag">
                    <div class="flag-red left"></div>
                    <div class="flag-white">
                        <div class="maple-leaf">🍁</div>
                    </div>
                    <div class="flag-red right"></div>
                </div>
                <div class="phone-icon">📱</div>
                <div class="npa-text">NPA/NXX<br>LOOK-UP</div>
            </div>
        </button>

        <!-- LoL Build Creator Button -->
        <button class="nav-button lol-button" onclick="location.href='/Projects/lol-build-creator.html'">
            <div class="button-content">
                <svg class="lol-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="lolGold" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#f0e6d2"/>
                            <stop offset="50%" stop-color="#c8aa6e"/>
                            <stop offset="100%" stop-color="#785a28"/>
                        </linearGradient>
                        <linearGradient id="lolBlade" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#9aa5ad"/>
                            <stop offset="50%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#9aa5ad"/>
                        </linearGradient>
                        <!-- One sword, reused twice -->
                        <g id="lolSword">
                            <polygon points="50,10 56,22 56,60 44,60 44,22" fill="url(#lolBlade)" stroke="#0a1428" stroke-width="1.5" stroke-linejoin="round"/>
                            <line x1="50" y1="20" x2="50" y2="58" stroke="#6b767e" stroke-width="1.5"/>
                            <rect x="34" y="60" width="32" height="7" rx="2" fill="url(#lolGold)" stroke="#0a1428" stroke-width="1.5"/>
                            <rect x="46.5" y="67" width="7" height="14" fill="#785a28" stroke="#0a1428" stroke-width="1.5"/>
                            <circle cx="50" cy="85" r="5" fill="url(#lolGold)" stroke="#0a1428" stroke-width="1.5"/>
                        </g>
                    </defs>

                    <!-- Hextech hexagon frame -->
                    <polygon points="50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5" fill="#0a1428" stroke="url(#lolGold)" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,11 84,30.5 84,69.5 50,89 16,69.5 16,30.5" fill="none" stroke="#0ac8b9" stroke-width="1.5" opacity="0.8"/>

                    <!-- Crossed swords -->
                    <g transform="translate(50 50) rotate(45) scale(0.88) translate(-50 -50)"><use href="#lolSword"/></g>
                    <g transform="translate(50 50) rotate(-45) scale(0.88) translate(-50 -50)"><use href="#lolSword"/></g>

                    <!-- Center gem -->
                    <polygon points="50,42 57,50 50,58 43,50" fill="#0ac8b9" stroke="#0a1428" stroke-width="1.5"/>
                </svg>
                <div class="lol-text">LOL BUILD<br>CREATOR</div>
            </div>
        </button>

        <!-- Blank Button -->
        <button class="nav-button blank-button" onclick="location.href='#blank'">
            <div class="button-content">
            </div>
        </button>
    </div>

    <script>
        // Add click handlers for the buttons
        document.querySelectorAll('.nav-button').forEach(button => {
            button.addEventListener('click', function() {
                console.log('Navigating to:', this.textContent.trim());
                // Add your navigation logic here
            });
        });
    </script>
</body>
</html>
