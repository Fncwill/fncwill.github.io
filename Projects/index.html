<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Teko:wght@300;400;500;600;700&family=Audiowide&family=Black+Ops+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: #2a2a2a;
            position: relative;
            overflow-x: hidden;
        }

        /* Perforated metal texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, transparent 2px, #2a2a2a 2px),
                linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #3a3a3a 100%);
            background-size: 8px 8px, 100% 100%;
            background-position: 0 0, 0 0;
            z-index: -1;
        }

        /* Additional metallic overlay for depth */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, rgba(70, 70, 70, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(0, 0, 0, 0.3) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Logo placeholder */
        .logo-container {
            width: 200px;
            height: 200px;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #353535, #1f1f1f);
            border-radius: 50%;
            box-shadow: 
                inset 0 4px 8px rgba(0, 0, 0, 0.6),
                0 8px 16px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(100, 149, 237, 0.2);
            border: 3px solid #404040;
            overflow: hidden;
            position: relative;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 1.5px, rgba(0, 0, 0, 0.1) 1.5px);
            background-size: 6px 6px;
            pointer-events: none;
            opacity: 0.3;
            z-index: 2;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            position: relative;
            z-index: 1;
        }

        .logo-placeholder {
            color: #666;
            font-size: 0.75rem;
            text-align: center;
            padding: 1rem;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            z-index: 1;
        }

        /* Button grid container */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
        }

        /* Navigation buttons */
        .nav-button {
            background: linear-gradient(145deg, #3a3a3a, #252525);
            border: none;
            padding: 3rem 2rem;
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Black Ops One', cursive;
            color: #c0c0c0;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 
                0 8px 16px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px solid #404040;
            text-shadow: 
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 10px rgba(100, 149, 237, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Thumbnail content container */
        .button-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Yahtzee button styles */
        .yahtzee-button {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
        }

        .yahtzee-button .dice-container {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .dice {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #000;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .yahtzee-text {
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-shadow: 
                3px 3px 0 #000,
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                0 0 20px rgba(255, 255, 0, 0.5);
            font-family: 'Black Ops One', cursive;
        }

        /* NPA/NXX button styles */
        .npa-button {
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
        }

        .canada-flag {
            width: 120px;
            height: 80px;
            margin-bottom: 1rem;
            position: relative;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .flag-red {
            position: absolute;
            background: #FF0000;
            height: 100%;
        }

        .flag-red.left {
            left: 0;
            width: 25%;
        }

        .flag-red.right {
            right: 0;
            width: 25%;
        }

        .flag-white {
            position: absolute;
            left: 25%;
            width: 50%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maple-leaf {
            font-size: 2.5rem;
            color: #FF0000;
        }

        .phone-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .npa-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #000;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            font-family: 'Black Ops One', cursive;
        }

        /* Blank button */
        .blank-button {
            background: linear-gradient(145deg, #3a3a3a, #252525);
        }

        /* Perforated texture on buttons */
        .nav-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 1.5px, rgba(0, 0, 0, 0.1) 1.5px);
            background-size: 6px 6px;
            pointer-events: none;
            opacity: 0.5;
        }

        .nav-button:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 12px 24px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 30px rgba(100, 149, 237, 0.5),
                0 0 60px rgba(100, 149, 237, 0.3);
            border-color: #6495ED;
            color: #ffffff;
            background: linear-gradient(145deg, #454545, #2f2f2f);
            text-shadow: 
                0 2px 4px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(100, 149, 237, 0.8),
                0 0 30px rgba(100, 149, 237, 0.5);
        }

        .nav-button:active {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 12px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Responsive design */
        @media (max-width: 900px) {
            .button-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 1rem;
            }

            .nav-button {
                padding: 2.5rem 1.5rem;
            }

            .yahtzee-text {
                font-size: 2rem;
            }

            .npa-text {
                font-size: 1.3rem;
            }

            .dice {
                width: 35px;
                height: 35px;
                font-size: 1.3rem;
            }

            .canada-flag {
                width: 90px;
                height: 60px;
            }

            .maple-leaf {
                font-size: 2rem;
            }

            .phone-icon {
                font-size: 2.5rem;
            }

            .logo-container {
                width: 150px;
                height: 150px;
                margin-bottom: 2rem;
            }
        }

        .lol-button {
    background: linear-gradient(135deg, #0a1428 0%, #091428 50%, #0a323c 100%);
    border: 2px solid #c8aa6e;
    border-radius: 6px;
    padding: 14px 20px;
    cursor: pointer;
    color: #f0e6d2;
    font-family: 'Georgia', serif;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    box-shadow: 0 0 8px rgba(200, 170, 110, 0.3);
}

.lol-button:hover {
    transform: translateY(-3px);
    border-color: #0ac8b9;
    box-shadow: 0 0 16px rgba(10, 200, 185, 0.6);
}

.lol-button:active {
    transform: translateY(0);
}

.lol-button .button-content {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* Emblem (replaces the flag) */
.lol-button .hex-emblem {
    display: flex;
    width: 54px;
    height: 36px;
    border: 1px solid #c8aa6e;
    border-radius: 3px;
    overflow: hidden;
}

.lol-button .hex-side {
    width: 12px;
    background: linear-gradient(180deg, #c8aa6e, #785a28);
}

.lol-button .hex-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a1428;
}

.lol-button .sword-icon {
    font-size: 18px;
}

.lol-button .shield-icon {
    font-size: 26px;
    filter: drop-shadow(0 0 4px rgba(10, 200, 185, 0.7));
}

.lol-button .lol-text {
    font-weight: bold;
    font-size: 13px;
    line-height: 1.3;
    letter-spacing: 1.5px;
    text-align: left;
    color: #f0e6d2;
}

.lol-button:hover .lol-text {
    color: #0ac8b9;
}
    </style>
</head>
<body>
    <!-- Logo placeholder -->
    <div class="logo-container">
        <img src="logo.jpg" alt="Logo" class="logo-image">
    </div>

    <!-- Button grid -->
    <div class="button-grid">
        <!-- Yahtzee Button -->
        <button class="nav-button yahtzee-button" onclick="location.href='/Projects/HtmlYahtzee.html'">
            <div class="button-content">
                <div class="dice-container">
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                    <div class="dice">⚅</div>
                </div>
                <div class="yahtzee-text">YHATZEE</div>
            </div>
        </button>

        <!-- NPA/NXX Lookup Button -->
        <button class="nav-button npa-button" onclick="location.href='/Projects/canadian_phone.html'">
            <div class="button-content">
                <div class="canada-flag">
                    <div class="flag-red left"></div>
                    <div class="flag-white">
                        <div class="maple-leaf">🍁</div>
                    </div>
                    <div class="flag-red right"></div>
                </div>
                <div class="phone-icon">📱</div>
                <div class="npa-text">NPA/NXX<br>LOOK-UP</div>
            </div>
        </button>

        <!-- LoL Build Creator Button -->
<button class="nav-button lol-button" onclick="location.href='/Projects/lol_build_creator.html'">
    <div class="button-content">
        <div class="hex-emblem">
            <div class="hex-side left"></div>
            <div class="hex-center">
                <div class="sword-icon">⚔️</div>
            </div>
            <div class="hex-side right"></div>
        </div>
        <div class="shield-icon">🛡️</div>
        <div class="lol-text">LEAGUE BUILD<br>CREATOR</div>
    </div>
</button>

     <!-- Blank Button -->
        <button class="nav-button blank-button" onclick="location.href='#blank'">
            <div class="button-content">
            </div>
        </button>
    </div>

    <script>
        // Add click handlers for the buttons
        document.querySelectorAll('.nav-button').forEach(button => {
            button.addEventListener('click', function() {
                console.log('Navigating to:', this.textContent.trim());
                // Add your navigation logic here
            });
        });
    </script>
</body>
</html>
